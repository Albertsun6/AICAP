# search-online-skills 源注册表（SSOT 种子）
#
# 这是「到线上找 skill」时要扫的市场/来源的**种子清单**。它不是写死的全部——
# skill 每次运行还会联网「发现」新市场（见 SKILL.md Step 2），确认有价值的新源
# 由用户拍板后**回写到本文件**再 `pnpm run ai:generate`，于是源会随用随长。
#
# 字段说明：
#   id        稳定短名（kebab-case）
#   kind      official | community | aggregator | registry
#   ref       org/repo（GitHub）或 registry 入口
#   trust     high | medium | low —— 决定排序时的质量加权与是否需额外人审
#   list_via  怎么列出它下面的 skill（供 agent 照做）
#   notes     擅长领域 / 已知坑
#
# 维护：新增源就在 sources 下追加一项；下线就删一项。改完跑 ai:generate。
# 改这里，不要改 .claude/skills/ 下的生成副本（会被覆盖）。

version: 1
updated: 2026-06-18

# ---- 联网「发现新源」用的探针（Step 2 用，不写死结果，只写怎么找）----
discovery_probes:
  github_repo_search:
    - 'gh search repos "claude skills" --sort stars --limit 30'
    - 'gh search repos "agent skills" SKILL.md --limit 30'
    - 'gh search repos "claude code skills" --sort stars --limit 20'
    - 'gh search code --filename SKILL.md "name:" --limit 30   # 反查含 SKILL.md 的仓库'
  aggregator_lists:
    # 聚合/awesome 列表本身就是「源的源」——读它们能发现注册表里还没有的市场
    - https://github.com/ComposioHQ/awesome-claude-skills
    - https://skills.sh/                      # 排行榜，按安装量排
  web_search:
    - '"claude skills" marketplace OR registry site:github.com'
    - 'awesome agent skills SKILL.md list'

# ---- 种子市场 ----
sources:
  - id: anthropics-skills
    kind: official
    ref: anthropics/skills
    trust: high
    list_via: 'gh api /repos/anthropics/skills/contents/skills --jq ".[]|select(.type==\"dir\").name"'
    notes: Anthropic 官方，纯 prompt、跨工具可移植，文档/前端/通用能力最稳

  - id: openai-skills
    kind: official
    ref: openai/skills
    trust: high
    list_via: 'gh api /repos/openai/skills/contents/ --jq ".[]|select(.type==\"dir\").name"'
    notes: OpenAI 官方，偏 Codex 生态

  - id: vercel-agent-skills
    kind: official
    ref: vercel-labs/agent-skills
    trust: high
    list_via: 'gh api /repos/vercel-labs/agent-skills/contents/ --jq ".[]|select(.type==\"dir\").name"'
    notes: Vercel 官方，React/Next/Vercel 栈、web design，安装量大

  - id: cloudflare-skills
    kind: official
    ref: cloudflare/skills
    trust: high
    list_via: 'gh api /repos/cloudflare/skills/contents/ --jq ".[]|select(.type==\"dir\").name"'
    notes: Cloudflare 平台专属（Workers/Pages/D1 等）

  - id: skills-sh-registry
    kind: registry
    ref: 'npx --yes skills find "<query>"'
    trust: medium
    list_via: 'npx --yes skills find "<query>" 2>&1 | head -60   # 失败回退 WebFetch https://skills.sh/?q=<query>'
    notes: 开放注册表 + CLI，带 install 计数。可一次性按关键词跨作者搜，但只覆盖已登记到 skills.sh 的

  - id: awesome-claude-skills
    kind: aggregator
    ref: ComposioHQ/awesome-claude-skills
    trust: medium
    list_via: 'WebFetch https://github.com/ComposioHQ/awesome-claude-skills 读 README 表格'
    notes: 社区聚合 awesome 列表——既是搜索目标，也是「发现新源」的入口

  - id: obra-superpowers
    kind: community
    ref: obra/superpowers
    trust: medium
    list_via: 'gh api /repos/obra/superpowers/contents/skills --jq ".[]|select(.type==\"dir\").name"'
    notes: 社区高人气 skill 合集；社区源安装前按 SKILL.md 内容人审一遍

  # ---- 2026-06-18 经 learning-skills 搜索发现并核实（真实 GitHub 市场；star 数为 gh api 实测，非杜撰）----
  - id: alirezarezvani-claude-skills
    kind: community
    ref: alirezarezvani/claude-skills
    trust: medium
    list_via: 'WebFetch https://github.com/alirezarezvani/claude-skills 读 README 索引；嵌套布局 <category>/<skill>/skills/<skill>/（如 engineering/llm-wiki/skills/llm-wiki），gh api 逐层列'
    notes: 18403★ MIT，337-skill 多领域大市场（含 llm-wiki 等 PKM/学习）；star 是整库级、非单 skill

  - id: sanyuan-skills
    kind: community
    ref: sanyuan0704/sanyuan-skills
    trust: medium
    list_via: 'gh api /repos/sanyuan0704/sanyuan-skills/contents/skills --jq ".[]|select(.type==\"dir\").name"'
    notes: 3657★ MIT 纯 prompt 市场；book-study（读书→Obsidian wiki→掌握度测验→真 SRS）即出自此，学习类强

  - id: arscontexta
    kind: community
    ref: agenticnotetaking/arscontexta
    trust: medium
    list_via: 'gh api /repos/agenticnotetaking/arscontexta/contents/skills --jq ".[]|select(.type==\"dir\").name"；建议整插件装 /plugin marketplace add agenticnotetaking/arscontexta'
    notes: 3409★ MIT 一方 PKM 插件（Ars Contexta，本地 md 知识库，9 skill+26 命令）；Claude Code 专用

  - id: dair-academy-plugins
    kind: community
    ref: dair-ai/dair-academy-plugins
    trust: medium
    list_via: 'gh api /repos/dair-ai/dair-academy-plugins/contents/plugins --jq ".[]|select(.type==\"dir\").name"（见 .claude-plugin/marketplace.json）'
    notes: 411★ DAIR.AI 一方（Prompt Engineering Guide 团队）；含 learn 辅导插件，质量信号可靠（但 learn 无 license 文件）

  - id: mercury-agent-skills
    kind: community
    ref: cosmicstack-labs/mercury-agent-skills
    trust: medium
    list_via: 'gh api /repos/cosmicstack-labs/mercury-agent-skills/contents/categories --jq ".[]|select(.type==\"dir\").name" 再逐 category 列；榜单 skills.mercuryagent.sh'
    notes: 352★ MIT 策划市场（24 类~132 skill，带 likes/installs 榜）；education-learning 类含 learning-science

  - id: lyndonkl-claude
    kind: community
    ref: lyndonkl/claude
    trust: medium
    list_via: 'gh api /repos/lyndonkl/claude/contents --jq ".[]|select(.type==\"dir\").name"；亦在 skills.sh（npx --yes skills find）'
    notes: 122★；少数有真实 skills.sh 安装量+安全审计的源（memory-retrieval-learning 出自此，330 installs）

  - id: majiayu-skill-registry
    kind: aggregator
    ref: majiayu000/claude-skill-registry
    trust: low
    list_via: 'gh api /repos/majiayu000/claude-skill-registry/contents/skills --jq ".[]" 或 WebFetch 仓库索引（~1000 skill 聚合镜像）'
    notes: 422★ 大型聚合镜像（按领域归类）——发现入口好，但坑多：抓取时常漏 references/ 致断链，metadata 多为 NOASSERTION/restricted，装前必查上游

  - id: ferrox-wayland-edu
    kind: community
    ref: FerroxLabs/wayland
    trust: low
    list_via: 'gh api 路径 src/process/resources/skills-library/bodies/skills/education/ 下逐 skill 列（非标准市场布局）'
    notes: 443★，Wayland 产品内置 127-skill 教育库（active-recall/spaced-repetition/flashcard-generation 等）；路径深、AGPL vs Apache license 矛盾，装需指目录

  - id: travisvn-awesome-claude-skills
    kind: aggregator
    ref: travisvn/awesome-claude-skills
    trust: medium
    list_via: 'WebFetch https://github.com/travisvn/awesome-claude-skills 读 README 表格（既是搜索目标也是「源的源」）'
    notes: 社区 awesome 聚合列表；可作发现新市场的入口

# /survey 模型排名文件 —— run-cursor-agent.sh 的 pick_strongest 与 doctor.sh 读它
#
# 这份文件是「上网查过之后」的结论，不是脚本里的猜测。出现新模型（runner / doctor 打
# NEW-MODEL: 提示）或核对日期超过 60 天（doctor 报 WARN）时：先查官方模型页、厂商发布说明
# 和独立评测，再改这里的 series / verified / checked / evidence，然后跑
# bash test-model-selection.sh。不许不查就把新名字抄进 verified 来消掉提示。
#
# 格式（纯文本；awk 与 bash 3.2 都能读）：
#   [族]                 gpt | gemini | grok
#   checked  = 日期      上次上网核对的日期，YYYY-MM-DD
#   series   = a b c     同一版本内系列的强弱顺序，靠前的强（该族没有系列就不写这一行）
#   verified = k1 k2 ..  已核实过的「版本[-系列]」清单（id 去掉族前缀和档位后缀，
#                        如 gpt-5.6-sol-xhigh -> 5.6-sol，cursor-grok-4.6-high -> 4.6）。
#                        带族前缀照抄 NEW-MODEL 提示里的名字（gpt-6.2-astra / grok-4.8）也认。
#                        id 里用连字符写的版本号（gpt-5-7-sol）按点号写法算，写 5.7-sol 或 5-7-sol 都认
#   evidence = URL       依据，可写多行
#   以 # 开头的整行是注释；checked / series / verified 的值后面可以跟行尾注释（# 前要有空白），
#   evidence 不行（URL 里可能有 #）。键名、段名、值不分大小写（读的时候统一转小写）。
#   其它键、同一版本核实了两个以上名字而其中的系列不在 series 顺序里、verified 带系列却没有
#   series 行、series 里名字重复 -> 脚本打 `WARN: [族] …`（doctor 汇总），多半是拼写错。
#
# 改哪一份：这个文件的源在 <仓库>/.rulesync/skills/survey/model-ranking.conf。.claude/skills/survey/
#   （~/.claude/skills/survey 指向它）是 `pnpm run ai:generate` 生成的镜像，直接改镜像会在下次生成时
#   被覆盖。改源 -> 在仓库根跑 pnpm run ai:generate -> 给镜像里的 .sh 补执行位 -> 跑测试。
#   bash test-model-selection.sh 的机制断言用的是 fixtures/model-ranking-test.conf，不随这里的顺序
#   变红；对本文件只做格式校验（三族都有取值合法的 checked 与 verified、清单覆盖夹具里的全部候选；
#   大小写不校验，读的时候统一转小写）。
#
# 选型规则（脚本里实现，这里只供阅读）：版本高的先赢，同版本按 series 顺序，再按档位偏好。
#   - 新模型提示（NEW-MODEL）在选型筛选之前做：该族任何 id 去掉档位 / -fast / -preview / -exp 后的
#     「版本[-系列]」不在 verified 里 -> 提示（小模型与专用形态 -mini -codex -flash 等只在版本高于
#     verified 的最高版本时提示）。裸 id、只有 -max 或低档、-preview 首发的也算。版本更高的候选
#     照样被选中；同版本内 series 里列出的系列 > 无系列的裸名 > 没列出的系列（彼此先比档位、
#     再按列表先后）。已列出系列的变体（sol-1m）紧跟在该系列正牌之后，高于下一档系列。
#   - 名字里有族名但形态认不出来的（xai-grok-5 / gpt6 / grok-code-5）也提示。
#   - 消掉提示：核实后把提示里的名字原样写进该族的 verified（gpt-6.2-astra、grok-4.8、grok-code-5
#     都照抄即可；去掉族前缀写成 6.2-astra、4.8 也行）。
#   - 盲区：名字里不含族名的新模型（如 OpenAI 的 o5）脚本检测不到。所以 60 天复查时不能只看
#     有没有 NEW-MODEL，要把 cursor-agent --list-models 全量过一遍，再对照厂商发布页。
#   - 每族只有一条顺序，搜索（high 档）和评审（xhigh 档）共用。调研里只有 gemini 的两类任务
#     建议不同（见该段说明）；想让某一次调用换顺序，在那条命令前加 SURVEY_SERIES_GEMINI='...'。
#   - 单次覆盖：SURVEY_SERIES_GPT / SURVEY_SERIES_GEMINI（优先于本文件；空格或逗号分隔，写了
#     verified 里没有的系列名会打 WARN）。
#
# 本文件 2026-11-19 的内容来自单模型联网查证，未经异构评审。

[gpt]
checked  = 2026-11-19
series   = sol terra luna
verified = 5.6-sol 5.6-terra 5.6-luna 5.5 5.4 5.2 5.1
# 依据（独立评测，置信度：Sol 第一为高，其余为中）：Artificial Analysis 智能指数 Sol(max) 59 /
#   Terra(max) 55 / Luna(max) 51；Coding Agent Index 80 / 77 / 75。AA 写明替 OpenAI 做过发布前
#   评测，独立性打折；没有找到第二家独立评测交叉验证。厂商与 Cursor 文档同样把 Sol 列为旗舰、
#   Terra 中档、Luna 最小档。
# 与本文件顺序不一致、脚本没有处理的地方：
#   - 调研排名是 5.6-sol > 5.6-terra ≈ 5.5 > 5.6-luna ≈ 5.4。脚本先比版本，所以 Sol、Terra 都
#     不在列表时会选 5.6-luna 而不是 5.5（AA：5.5 xhigh 55，Luna max 51）。遇到这种情况用
#     SURVEY_CURSOR_MODEL 钉 gpt-5.5-extra-high。
#   - xhigh 档上 Terra(52) 可能不如 5.5(55)，这两个数只在搜索摘要里见到，对应的 AA 对比页 404，未核实。
#   - 5.2、5.1 只按版本号推断，没有查评测（置信度低）。
# 未查到的：各档位实际耗时；5.6 各系列 high 档的独立评测分。
# 供货：OpenAI 自家最新已是 GPT-6.2（新闻报道 2026-11-17 发布），但 Cursor 实时列表里没有任何
#   gpt-6 id；二手报道称 OpenAI 在 Cursor 被收购后不再向它提供新模型，原始公告未打开核实。
#   所以这一族在 Cursor 通道里停在 5.6，且可能整族下线（runner 会报「该族可能已下架」并 fail-closed）。
evidence = https://artificialanalysis.ai/articles/gpt-5-6-has-landed
evidence = https://artificialanalysis.ai/models/comparisons/gpt-5-5-vs-gpt-5-4
evidence = https://the-decoder.com/gpt-5-6-sol-nearly-matches-fable-5-on-aggregated-benchmarks-at-one-third-the-cost/
evidence = https://techcrunch.com/2026/07/09/openai-launches-its-new-family-of-models-with-gpt-5-6/
evidence = https://cursor.com/docs/models

[gemini]
checked  = 2026-11-19
series   = neon carbon hydrogen argon
verified = 4-neon 4-carbon 4-hydrogen 4-argon 3.1-pro
# 依据（置信度：中）：Neon 2026-11-18 GA，是最新的；Artificial Analysis 智能指数 v5.0.1 上
#   Neon xhigh 61、Neon high 60、Carbon high 60、Hydrogen 最高 54、Argon 最高 50。
# Neon 与 Carbon 谁更强没有定论，这里把 Neon 排第一是一个取舍，不是定论：
#   - 独立评测只差 1 分（误差量级），Neon 更快（约 101 tok/s 对 56 tok/s），且 Cursor 里 Carbon 没有 xhigh 档。
#   - 厂商口径相反：Google 模型页在 Neon 发布后仍称 Carbon 为最强推理模型，Cursor 页写「最难的任务用 Carbon」。
#   - 调研对两类任务的建议是：搜索用 gemini-4-neon-high，全文评审用 gemini-4-carbon-high
#     （并注明 gemini-4-neon-xhigh 是几乎等价的备选，独立指数上还略高）。本文件每族只有一条顺序，
#     所以评审档（xhigh）解析到的是 gemini-4-neon-xhigh。想让评审用 Carbon：在那条命令前加
#     SURVEY_SERIES_GEMINI='carbon neon'，或把上面的 series 改成 carbon 在前。
# Hydrogen 排在 Argon 之前只依据 AA 指数（54 对 50）；Google 的定位是 Argon 属前沿推理、Hydrogen
#   属日常档，方向相反，这一位次把握不大。
# 3.1-pro 是上一代，没有查到与 Gemini 4 同口径的独立分数（AA 显示 N/A），靠版本号排在最后（置信度低）。
# 未查到的：各 id 在 cursor-agent 里的实际耗时；联网搜索质量的专门评测。数字由抓取工具摘要返回，
#   未逐字对照原页面。
evidence = https://artificialanalysis.ai/models/gemini-4-neon
evidence = https://artificialanalysis.ai/models/gemini-4-carbon
evidence = https://aistudio.google.com/docs/changelog
evidence = https://aistudio.google.com/docs/models
evidence = https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-neon/
evidence = https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-carbon/
evidence = https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/
evidence = https://9to5google.com/2026/11/18/gemini-4-neon-announcement/
evidence = https://cursor.com/docs/models/gemini-4-neon
evidence = https://cursor.com/docs/models/gemini-4-carbon

[grok]
checked  = 2026-11-19
verified = 4.7 4.6 4.5
# 这一族没有系列，只按版本排：4.7 > 4.6 > 4.5（实时列表里 4.7 是 grok-4.7-*，4.6 / 4.5 是 cursor-grok-*）。
# 依据：4.6 > 4.5 多家独立来源一致（置信度高）。4.7 > 4.6 置信度只有中，证据互相矛盾：
#   - 支持 4.7：Artificial Analysis 智能指数 46 对 44，幻觉率 34% 降到 29%；Vals 指数 60.22% 对 59.17%。
#   - 支持 4.6：Epoch ECI 156 对 158；FrontierMath 1-3 档 53% 对 66%、4 档 17% 对 32%；
#     4.7 的长上下文推理（AA-LCR）回退 3.7 个百分点，这和全文评审直接相关。
#   评审偏长文档或数学推理时 cursor-grok-4.6-xhigh 是合理备选：SURVEY_CURSOR_MODEL=cursor-grok-4.6-xhigh。
# 未核实的：AA 指数跨页面不一致（发布文 46 / 44，模型页一次抓取显示 35）；Vals 同页有两组数字；
#   Epoch 未注明评测档位；Cursor 的 cursor-grok-4.6 与 xAI API 的 grok-4.6 是否同一权重未确认；
#   4.7 的 xhigh 相对 high 有没有实质增益不清楚；各档位在 cursor-agent 里的耗时没有实测。
evidence = https://x.ai/news/grok-4-7
evidence = https://artificialanalysis.ai/articles/benchmarking-grok-4-7
evidence = https://vals.ai/models/grok_grok-4.7
evidence = https://epoch.ai/models/grok-4-7
evidence = https://the-decoder.com/xai-launches-grok-4-7-at-bargain-prices-but-benchmarks-reveal-a-wide-gap-to-claude-and-gpt-6/
evidence = https://codersera.com/blog/grok-4-6-vs-grok-4-5-2026/
evidence = https://docs.x.ai/docs/models

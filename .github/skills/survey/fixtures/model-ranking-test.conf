# 测试专用的固定排名文件——test-model-selection.sh 的机制断言读它，不读真实的 model-ranking.conf。
# 这样按查证结果改真实排名（换顺序、加系列）时，机制断言不会跟着变红。
# 内容是 2026-11-19 的排名快照，只为让断言有确定的期望值；不要拿它当现行排名，也不必随真实文件更新。
[gpt]
checked  = 2026-11-19
series   = sol terra luna
verified = 5.6-sol 5.6-terra 5.6-luna 5.5 5.4 5.2 5.1
evidence = https://example.invalid/test-fixture

[gemini]
checked  = 2026-11-19
series   = neon carbon hydrogen argon
verified = 4-neon 4-carbon 4-hydrogen 4-argon 3.1-pro
evidence = https://example.invalid/test-fixture

[grok]
checked  = 2026-11-19
verified = 4.7 4.6 4.5
evidence = https://example.invalid/test-fixture
